# DFS Phase-2 configuration

block_size: 1048576   # 1 MiB

# Raft replication group size.  Every block is replicated across this many
# DataNodes.  New block allocation is denied if fewer DataNodes are available.
replication_factor: 3

# Seconds of silence from a block's Raft leader before the Master marks
# that block cluster as unavailable.  Resets on NotifyLeader.
heartbeat_timeout: 15

# How often DataNodes send registration heartbeats to the Master (seconds).
dn_heartbeat_interval: 10

# Seconds since the last registration heartbeat before a DataNode is
# considered unreachable for new block allocation.  Should be at least
# 2 × dn_heartbeat_interval to tolerate one missed heartbeat.
dn_liveness_timeout: 30

# Seconds a block must remain unavailable before the Master triggers automatic
# peer replacement.  Default: 3 × heartbeat_timeout (45 s).  Set to 0 to
# disable automatic recovery.
# recovery_threshold: 45

master:
  host: "127.0.0.1"
  port: 50051
  metadata_dir: "/tmp/dfs/master"

datanodes:
  - id: dn0
    host: "127.0.0.1"
    port: 50052
    data_dir: "/tmp/dfs/dn0"

  - id: dn1
    host: "127.0.0.1"
    port: 50053
    data_dir: "/tmp/dfs/dn1"

  - id: dn2
    host: "127.0.0.1"
    port: 50054
    data_dir: "/tmp/dfs/dn2"
