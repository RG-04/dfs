syntax = "proto3";

package dfs;

// Phase 2: Each DataNode participates in one Raft group per block it holds.
// The block's Raft leader is the single endpoint for client reads/writes.
// Followers only participate in Raft consensus (AppendEntries, RequestVote).
service DataNode {
  // Block lifecycle (called by MasterNode only)
  rpc RegisterBlock (RegisterBlockRequest) returns (RegisterBlockResponse);
  rpc DeleteBlock   (DeleteBlockRequest)   returns (DeleteBlockResponse);

  // Data plane (called by DFS client only — routed to current Raft leader)
  rpc ReadBlock  (ReadBlockRequest)  returns (ReadBlockResponse);
  rpc WriteBlock (WriteBlockRequest) returns (WriteBlockResponse);

  // Raft peer RPCs (DataNode ↔ DataNode, not called by client or master)
  rpc RequestVote   (VoteRequest)            returns (VoteResponse);
  rpc AppendEntries (AppendEntriesRequest)   returns (AppendEntriesResponse);

  // Dynamic membership (called by current Raft leader on behalf of MasterNode)
  rpc AddPeer         (AddPeerRequest)         returns (AddPeerResponse);
  rpc RemovePeer      (RemovePeerRequest)      returns (RemovePeerResponse);
  rpc InstallSnapshot (InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// ── Block lifecycle ────────────────────────────────────────────────────────

message RegisterBlockRequest {
  string block_id          = 1;
  // All members of this block's Raft group as "host:port" strings
  // (includes this node itself).  Empty list = Phase-1 singleton.
  repeated string peer_addresses = 2;
  // True for exactly one node — that node starts as the initial Raft leader.
  bool is_initial_leader   = 3;
}
message RegisterBlockResponse { bool ok = 1; string error = 2; }

message DeleteBlockRequest    { string block_id = 1; }
message DeleteBlockResponse   { bool ok = 1; string error = 2; }

// ── Data plane ─────────────────────────────────────────────────────────────

message ReadBlockRequest {
  string block_id           = 1;
  int64  intra_block_offset = 2;
  int64  length             = 3;
  // Minimum Raft term this node must have exceeded to serve the request.
  // Set by the client from BlockInfo.min_leader_term returned by the Master.
  // The node rejects if own_term <= min_term (stale/isolated leader guard).
  int64  min_term           = 4;
}

message ReadBlockResponse {
  bool   ok    = 1;
  string error = 2;
  bytes  data  = 3;
}

message WriteBlockRequest {
  string block_id           = 1;
  int64  intra_block_offset = 2;
  bytes  data               = 3;
  // Same semantics as ReadBlockRequest.min_term — enables early detection of
  // a write that will fail anyway due to the leader being isolated.
  int64  min_term           = 4;
}

message WriteBlockResponse {
  bool   ok    = 1;
  string error = 2;
}

// ── Raft messages ──────────────────────────────────────────────────────────

// Entry types for the Raft log.
// DATA   — a normal block write (intra_block_offset + data are used).
// CONFIG — a membership change (new_peers replaces the group peer list).
enum LogEntryType {
  DATA   = 0;
  CONFIG = 1;
}

message LogEntry {
  int64        term               = 1;
  int64        intra_block_offset = 2;
  bytes        data               = 3;
  int64        index              = 4;  // 1-based position in the log
  LogEntryType entry_type         = 5;
  // Populated for CONFIG entries only: the full new peer list (host:port).
  repeated string new_peers       = 6;
}

message VoteRequest {
  string block_id        = 1;
  int64  term            = 2;
  string candidate_id    = 3;  // "host:port" of the candidate
  int64  last_log_index  = 4;
  int64  last_log_term   = 5;
}

message VoteResponse {
  int64  term         = 1;
  bool   vote_granted = 2;
}

message AppendEntriesRequest {
  string block_id       = 1;
  int64  term           = 2;
  string leader_id      = 3;  // "host:port" of the leader
  int64  prev_log_index = 4;
  int64  prev_log_term  = 5;
  repeated LogEntry entries = 6;
  int64  leader_commit  = 7;
}

message AppendEntriesResponse {
  int64  term        = 1;
  bool   success     = 2;
  int64  match_index = 3;  // highest log index known to be replicated here
}

// ── Dynamic membership ─────────────────────────────────────────────────────

// Sent by the MasterNode to the current Raft leader to add a new peer.
// The leader will call InstallSnapshot on the new peer, then append a
// CONFIG log entry to the group.
message AddPeerRequest {
  string block_id      = 1;
  string new_peer_addr = 2;  // "host:port" of the node being added
}
message AddPeerResponse {
  bool   ok    = 1;
  string error = 2;
}

// Sent by the MasterNode to the current Raft leader to remove a peer.
// The leader appends a CONFIG log entry removing that peer.
message RemovePeerRequest {
  string block_id       = 1;
  string peer_addr      = 2;  // "host:port" of the node being removed
}
message RemovePeerResponse {
  bool   ok    = 1;
  string error = 2;
}

// Sent by the current Raft leader to a new peer to transfer the full
// block snapshot (current block file contents) before normal replication.
message InstallSnapshotRequest {
  string block_id      = 1;
  int64  term          = 2;
  string leader_id     = 3;
  int64  last_included_index = 4;  // log index the snapshot covers up to
  int64  last_included_term  = 5;
  bytes  data          = 6;        // full block file contents
  // The current committed peer list (so the new peer knows the group).
  repeated string peers = 7;
}
message InstallSnapshotResponse {
  int64  term    = 1;
  bool   success = 2;
  string error   = 3;
}
