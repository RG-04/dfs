syntax = "proto3";

package dfs;

service MasterNode {
  // ── File operations ──────────────────────────────────────────────────────
  rpc CreateFile (CreateFileRequest) returns (CreateFileResponse);
  rpc DeleteFile (DeleteFileRequest) returns (DeleteFileResponse);

  // ── Directory operations ──────────────────────────────────────────────────
  // Create a directory.  Parent must already exist.
  rpc Mkdir   (MkdirRequest)   returns (MkdirResponse);
  // Remove an empty directory.  Fails if it contains files or subdirectories.
  rpc Rmdir   (RmdirRequest)   returns (RmdirResponse);
  // Stat a path (file or directory).
  rpc Stat    (StatRequest)    returns (StatResponse);
  // List the immediate children of a directory.
  rpc ListDir (ListDirRequest) returns (ListDirResponse);

  // ── Block routing ─────────────────────────────────────────────────────────
  rpc GetBlockInfo     (GetBlockInfoRequest)     returns (GetBlockInfoResponse);

  // ── DataNode registration ─────────────────────────────────────────────────
  rpc RegisterDataNode (RegisterDNRequest)       returns (RegisterDNResponse);

  // ── Raft leader lifecycle notifications ──────────────────────────────────
  // Called by a DataNode immediately after winning a Raft election.
  rpc NotifyLeader   (NotifyLeaderRequest)   returns (NotifyLeaderResponse);
  // Periodic heartbeat sent by the current Raft leader for each block.
  rpc BlockHeartbeat (BlockHeartbeatRequest) returns (BlockHeartbeatResponse);

  // ── Dynamic membership ────────────────────────────────────────────────────
  // Called by DataNode leader after committing a CONFIG (membership-change)
  // log entry, so the Master can update its block metadata.
  rpc UpdateBlockPeers (UpdateBlockPeersRequest) returns (UpdateBlockPeersResponse);
}

// ── File operations ────────────────────────────────────────────────────────

message CreateFileRequest  { string path = 1; }
message CreateFileResponse { bool ok = 1; string error = 2; }

message DeleteFileRequest  { string path = 1; }
message DeleteFileResponse { bool ok = 1; string error = 2; }

// ── Directory operations ───────────────────────────────────────────────────

message MkdirRequest  { string path = 1; }
message MkdirResponse { bool ok = 1; string error = 2; }

message RmdirRequest  { string path = 1; }
message RmdirResponse { bool ok = 1; string error = 2; }

// StatEntry describes either a file or a directory.
message StatEntry {
  enum Type { FILE = 0; DIR = 1; }
  Type   type       = 1;
  string name       = 2;  // basename of the path
  int32  num_blocks = 3;  // number of allocated blocks (files only; 0 for dirs)
}

message StatRequest  { string path = 1; }
message StatResponse { bool ok = 1; string error = 2; StatEntry entry = 3; }

message ListDirRequest  { string path = 1; }
message ListDirResponse {
  bool             ok      = 1;
  string           error   = 2;
  repeated StatEntry entries = 3;
}

// ── Block routing ──────────────────────────────────────────────────────────

enum Intent {
  READ  = 0;
  WRITE = 1;
}

message GetBlockInfoRequest {
  string path        = 1;
  int32  block_index = 2;
  Intent intent      = 3;
}

message BlockInfo {
  string block_id       = 1;
  string datanode_id    = 2;
  string datanode_host  = 3;
  int32  datanode_port  = 4;
  // Stale-leader guard: the last Raft election term the Master is aware of,
  // minus one.  The DataNode must have term strictly greater than this value
  // to serve the request.  A leader isolated before the latest election will
  // have an equal or lower term and will correctly reject the request.
  int64  min_leader_term = 5;
}

message GetBlockInfoResponse {
  bool      ok    = 1;
  string    error = 2;
  BlockInfo block = 3;
}

// ── DataNode registration ──────────────────────────────────────────────────

message RegisterDNRequest {
  string datanode_id = 1;
  string host        = 2;
  int32  port        = 3;
}

message RegisterDNResponse {
  bool   ok    = 1;
  string error = 2;
}

// ── Raft leader notifications ──────────────────────────────────────────────

message NotifyLeaderRequest {
  string block_id   = 1;
  string leader_id  = 2;  // datanode_id of the new leader
  int64  term       = 3;
}

message NotifyLeaderResponse {
  bool   ok    = 1;
  string error = 2;
}

message BlockHeartbeatRequest {
  string block_id   = 1;
  string leader_id  = 2;  // datanode_id of the current leader
  int64  term       = 3;
}

message BlockHeartbeatResponse {
  bool ok = 1;
}

// ── Dynamic membership ─────────────────────────────────────────────────────

message UpdateBlockPeersRequest {
  string          block_id  = 1;
  repeated string peers     = 2;  // full new peer list as dn_id strings
  int64           term      = 3;
}

message UpdateBlockPeersResponse {
  bool   ok    = 1;
  string error = 2;
}
